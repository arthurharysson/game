name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install pygame pyinstaller

      - name: Compilar .exe
        run: |
          pyinstaller --onefile --noconsole --name ConectaRun main.py

      - name: Copiar assets para dist
        run: |
          if (Test-Path "assets") {
            Copy-Item -Recurse assets dist/assets
          }

      - name: Zipar tudo
        run: |
          Compress-Archive -Path dist/* -DestinationPath ConectaRun_Windows.zip

      - name: Upload do ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ConectaRun_Windows
          path: ConectaRun_Windows.zip
          retention-days: 7
